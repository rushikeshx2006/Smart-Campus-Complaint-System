<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixIt - Settings</title>

    <link rel="stylesheet" href="staff-settings.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="navbar">

        <div class="logo-area">

            <img src="LOGO.png" alt="FixIt Logo">

            <h1>
                Fix<span>It</span>
            </h1>

        </div>


        <div class="header-right">

            <div class="notification">

                <i class="fa-solid fa-bell"></i>

                <span></span>

            </div>


            <div class="staff-profile">

                <div class="staff-icon">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <h2>Dr. Prasad</h2>
                    <p>Staff</p>
                </div>

            </div>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="main-container">


        <!-- ================= LEFT ================= -->

        <section class="left-section">


            <!-- Profile -->

            <div class="big-profile">

            </div>


            <!-- Menu -->

            <div class="profile-menu">

                <button>
                    Profile Inf.
                </button>

                <button>
                    Change Password
                </button>

                <button class="active">
                    Setting
                </button>

            </div>

        </section>



        <!-- ================= SETTINGS CARD ================= -->

        <section class="settings-card">


            <!-- Heading -->

            <div class="setting-heading">
                • &nbsp;Setting
            </div>



            <!-- Dark / Light Mode -->

            <div class="mode-buttons">

                <button class="dark-mode">
                    Dark Mode
                </button>

                <button class="light-mode">
                    Light Mode
                </button>

            </div>



            <!-- Logged In Devices -->

            <div class="devices">

                <h2>
                    Logged In Devices
                </h2>

                <ul>

                    <li>
                        Mac AIR :- 192.168.1.101
                    </li>

                    <li>
                        HP ATC:- 192.168.1.34
                    </li>

                    <li>
                        Mac AIR :- 192.168.1.101
                    </li>

                </ul>

            </div>



            <!-- Bottom Section -->

            <div class="bottom-section">


                <!-- Social Icons -->

                <div class="social-icons">

                    <a href="#">
                        <i class="fa-brands fa-telegram"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                    <a href="#">
                        <i class="fa-brands fa-google"></i>
                    </a>

                </div>



                <!-- Buttons -->

                <div class="action-buttons">

                    <button class="update-btn">
                        Update Password
                    </button>

                    <button class="logout-btn">
                        Log OUT
                    </button>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
