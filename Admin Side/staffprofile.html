<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <link rel="stylesheet" href="staffprofile.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logoArea">

            <img src="LOGO.png" class="logo">

            <div class="fixit">
                <span class="fix">Fix</span><span class="it">It</span>
            </div>

        </div>


        <div class="headerRight">

            <div class="notification">
                🔔
                <span></span>
            </div>

            <div class="user">

                <div class="userIcon">
                    👤
                </div>

                <div class="userDetails">
                    <h2>Dr. Prasad</h2>
                    <p>Staff</p>
                </div>

            </div>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- LEFT SIDE -->

        <div class="leftSide">

            <div class="profileImage">

                <div class="head"></div>
                <div class="body"></div>

            </div>


            <div class="menu">

                <button class="active">
                    Profile Inf.
                </button>

                <button>
                    Change Password
                </button>

                <button>
                    Setting
                </button>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="profileBox">

            <div class="profileTitle">
                <span>•</span>
                <u>Profile Inf.</u>
            </div>


            <div class="information">

                <div class="infoRow">
                    <label>Name :</label>
                    <span >________________________________</span>
                </div>

                <div class="infoRow">
                    <label>Staff Id :</label>
                    <span>_______________________________</span>
                </div>

                <div class="infoRow">
                    <label>Email:</label>
                    <span>________________________________</span>
                </div>

                <div class="infoRow">
                    <label>Location:</label>
                    <span>_______________________________</span>
                </div>

                <div class="infoRow">
                    <label>Phone :</label>
                    <span>_______________________________</span>
                </div>

            </div>


            <button class="update">
                Update Information
            </button>

        </div>

    </main>

</body>
</html>
