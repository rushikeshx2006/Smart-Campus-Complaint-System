<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixIt - Profile</title>

    <link rel="stylesheet" href="profile.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="navbar">

        <!-- Logo -->

        <div class="logo-area">

            <img src="LOGO.png" alt="FixIt Logo">

            <h1>
                Fix<span>It</span>
            </h1>

        </div>


        <!-- Right Side -->

        <div class="header-right">

            <!-- Notification -->

            <div class="notification">

                <i class="fa-solid fa-bell"></i>

                <span>3</span>

            </div>


            <!-- Profile -->

            <div class="header-profile">

                <div class="profile-icon">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="profile-name">

                    <h3>Rushi Chaudhari</h3>

                    <p>Student</p>

                </div>

            </div>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="main-container">


        <!-- ================= LEFT SIDE ================= -->

        <section class="left-section">


            <!-- Profile Image -->

            <div class="big-profile">

                <i class="fa-solid fa-user"></i>

            </div>


            <!-- Profile Menu -->

            <div class="profile-menu">

                <button class="active-btn">
                    Profile Inf.
                </button>

                <button>
                    Change Password
                </button>

                <button>
                    Setting
                </button>

            </div>

        </section>



        <!-- ================= PROFILE INFORMATION ================= -->

        <section class="profile-card">

            <a href="#" class="profile-heading">
                • &nbsp;Profile Inf.
            </a>


            <div class="information">


                <!-- Name -->

                <div class="info-row">

                    <label>Name :</label>

                    <input type="text"
                           value="Rushi Chaudhari">

                </div>


                <!-- Student ID -->

                <div class="info-row">

                    <label>Student Id :</label>

                    <input type="text"
                           value="92500120016">

                </div>


                <!-- Email -->

                <div class="info-row">

                    <label>Email:</label>

                    <input type="email"
                           value="rushikesh.chaudhari140722@gmail.com">

                </div>


                <!-- Room -->

                <div class="info-row">

                    <label>Room No. :</label>

                    <input type="text"
                           value="xxx">

                </div>


                <!-- Phone -->

                <div class="info-row">

                    <label>Phone :</label>

                    <input type="text"
                           value="848287****">

                </div>


                <!-- Department -->

                <div class="info-row">

                    <label>Department :</label>

                    <input type="text"
                           value="CSE">

                </div>


            </div>


            <!-- Update Button -->

            <button class="update-btn">
                Update Information
            </button>


            <!-- Back -->

            <a href="#" class="back">
                &lt;-Back
            </a>

        </section>

    </main>

</body>
</html>
