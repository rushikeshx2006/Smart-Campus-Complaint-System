<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixIt - Change Password</title>

    <link rel="stylesheet" href="change-password.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="navbar">

        <div class="logo-area">

            <img src="LOGO.png" alt="FixIt Logo">

            <h1>
                Fix<span>It</span>
            </h1>

        </div>


        <div class="header-right">

            <div class="notification">
                <i class="fa-solid fa-bell"></i>
                <span>3</span>
            </div>


            <div class="header-profile">

                <div class="profile-icon">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="profile-name">
                    <h3>Rushi Chaudhari</h3>
                    <p>Student</p>
                </div>

            </div>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="main-container">


        <!-- ================= LEFT ================= -->

        <section class="left-section">

            <div class="big-profile">

            </div>


            <div class="profile-menu">

                <button>
                    Profile Inf.
                </button>

                <button class="active-btn">
                    Change Password
                </button>

                <button>
                    Setting
                </button>

            </div>

        </section>



        <!-- ================= CHANGE PASSWORD ================= -->

        <section class="password-card">

            <a href="#" class="password-heading">
                • &nbsp;Change Password
            </a>


            <div class="password-form">


                <!-- Student ID -->

                <div class="form-row">

                    <label>
                        Student Id :
                    </label>

                    <input type="text">

                </div>


                <!-- Email -->

                <div class="form-row email-row">

                    <label>
                        Email :
                    </label>

                    <input type="email">

                    <button class="otp-btn">
                        get OTP
                    </button>

                </div>


                <!-- Previous Password -->

                <div class="form-row">

                    <label>
                        Previous Password :
                    </label>

                    <input type="password">

                </div>


                <!-- New Password -->

                <div class="form-row new-password">

                    <label>
                        New Password :
                    </label>

                    <input type="password">

                </div>

            </div>


            <!-- Update Password -->

            <button class="update-btn">
                Update Password
            </button>

        </section>

    </main>

</body>

</html>
