<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications</title>

    <link rel="stylesheet" href="Notification.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <!-- LOGO -->
        <div class="logoArea">

            <img src="LOGO.png" class="logo">

            <div class="fixit">
                <span class="fix">Fix</span><span class="it">It</span>
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="rightHeader">

            <!-- NOTIFICATION -->
            <div class="bell">
                🔔
                <span class="dot"></span>
            </div>


            <!-- USER PROFILE -->
            <div class="profile">

                <div class="userIcon">
                    👤
                </div>

                <div class="userInfo">

                    <div class="userName">
                        Rushi Chaudhari
                    </div>

                    <div class="userRole">
                        Student
                    </div>

                </div>

            </div>

        </div>

    </header>


    <!-- MAIN -->
    <main>

        <!-- TITLE -->
        <div class="notificationHead">

            <h1>Notifications -</h1>

            <a href="#">Marks as all read-</a>

        </div>


        <!-- EMPTY NOTIFICATION -->
        <div class="emptyNotification">

            <div class="noIcon">

                <div class="circle"></div>

                <div class="slash"></div>

            </div>

            <h2>NO Notification !</h2>

        </div>

    </main>

</body>
</html>
